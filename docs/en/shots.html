<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jedit Pro Screens</title>
<link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
<nav>
  <a href="index.html#features">&larr; Back to features</a>
</nav>
<main class="wide">
  <div class="viewer-head">
    <a href="index.html#features" class="btn btn-secondary">&larr; Back to features</a>
    <span class="counter" id="counter"></span>
  </div>

  <h1 class="viewer-title" id="shot-title"></h1>

  <div class="viewer-stage">
    <img id="shot-img" alt="">
  </div>

  <div class="viewer-nav">
    <button type="button" class="btn btn-secondary" id="prev">&larr; Previous</button>
    <button type="button" class="btn btn-secondary" id="next">Next &rarr;</button>
  </div>

  <p class="viewer-hint">
    Use <strong>&larr;</strong> / <strong>&rarr;</strong> to move between screens,
    and <strong>Esc</strong> to go back to the feature list.
  </p>

  <p class="viewer-desc" id="shot-desc"></p>
</main>
<footer>
  <p>&copy; 2026 Satoshi Matsumoto. All rights reserved.</p>
  <p><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a></p>
</footer>

<script>
(function () {
  "use strict";

  var SHOTS = [
    {
      id: "multi-search",
      title: "Multi-File Find & Replace",
      desc: "Search across multiple files at once. Jump from a results panel to any match, replace selected matches in bulk, and run multi-pair batch replacements."
    },
    {
      id: "document-compare",
      title: "Document Comparison",
      desc: "Compare two documents side by side with color-coded differences. You can also compare against a saved version, and double-click a difference to jump to that spot in the document."
    },
    {
      id: "smart-index",
      title: "Smart Index",
      desc: "Auto-generate an outline in the sidebar. Customizable extraction rules support Markdown, HTML, programming languages, and more, and entries can be imported into bookmarks."
    },
    {
      id: "syntax-coloring",
      title: "Syntax Coloring",
      desc: "Color-code keywords for programming and markup languages. Built-in language definitions plus user-defined coloring rules."
    },
    {
      id: "shortcuts",
      title: "Menu / Key Binding Customization",
      desc: "Customize menu keyboard shortcuts and text editing key bindings. Emacs-style key bindings can be reproduced."
    },
    {
      id: "ruby",
      title: "Aozora Bunko Ruby",
      desc: "Aozora Bunko annotations are rendered as real ruby text. Ruby appears in the editor, in print, and in HTML export, in both vertical and horizontal writing."
    }
  ];

  var BACK_URL = "index.html#features";

  var img = document.getElementById("shot-img");
  var titleEl = document.getElementById("shot-title");
  var descEl = document.getElementById("shot-desc");
  var counterEl = document.getElementById("counter");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  var index = 0;

  function indexFromHash() {
    var id = (location.hash || "").replace(/^#/, "");
    for (var i = 0; i < SHOTS.length; i++) {
      if (SHOTS[i].id === id) return i;
    }
    return 0;
  }

  // Replace the hash instead of pushing it, so the browser's Back button
  // returns to the feature list rather than stepping through every screen.
  function show(i, updateHash) {
    index = (i + SHOTS.length) % SHOTS.length;
    var s = SHOTS[index];
    img.src = "../shots/en/" + s.id + ".png";
    img.alt = s.title;
    titleEl.textContent = s.title;
    descEl.textContent = s.desc;
    counterEl.textContent = (index + 1) + " / " + SHOTS.length;
    document.title = s.title + " — Jedit Pro Screens";
    if (updateHash !== false && history.replaceState) {
      history.replaceState(null, "", "#" + s.id);
    }
  }

  prevBtn.addEventListener("click", function () { show(index - 1); });
  nextBtn.addEventListener("click", function () { show(index + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case "ArrowLeft":
      case "ArrowUp":
        e.preventDefault();
        show(index - 1);
        break;
      case "ArrowRight":
      case "ArrowDown":
      case " ":
        e.preventDefault();
        show(index + 1);
        break;
      case "Home":
        e.preventDefault();
        show(0);
        break;
      case "End":
        e.preventDefault();
        show(SHOTS.length - 1);
        break;
      case "Escape":
      case "Backspace":
        e.preventDefault();
        location.href = BACK_URL;
        break;
    }
  });

  window.addEventListener("hashchange", function () {
    show(indexFromHash(), false);
  });

  show(indexFromHash(), false);
})();
</script>
</body>
</html>
